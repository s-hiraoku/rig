title: Rig User Guide
description: A local AI coding harness — file-backed tasks, inspectable run artifacts, isolated worktree edits, and an optional MCP adapter.

plugins:
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  parse_block_html: true
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
